kind = "web"
previewPath = "/"
title = "DomHunter"
version = "1.0.0"
id = "artifacts/domhunter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22487

[services.development]
run = "pnpm --filter @workspace/domhunter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/domhunter", "run", "build" ]
publicDir = "artifacts/domhunter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22487"
BASE_PATH = "/"
